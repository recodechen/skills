<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsibility Map</title><style>
:root{--bg:#f6f8fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#cfd6e4;--accent:#2f6fed;--accent-soft:#eaf1ff;--warn:#9a6700;--danger:#b42318}
*{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid #e7eaf0}.brand{font-weight:750;white-space:nowrap}.title{color:#667085;font-size:13px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.search{margin-left:10px;flex:1;max-width:520px;position:relative}.search input{width:100%;height:36px;border:1px solid #d5dae5;border-radius:8px;padding:0 12px;outline:none;background:#fbfcfe}.toolbar{margin-left:auto;display:flex;gap:7px}.btn{height:34px;padding:0 11px;border:1px solid #d6dce8;border-radius:8px;background:#fff;color:#344054;cursor:pointer;white-space:nowrap}.btn:hover{background:#f7f9fc}.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}.canvas-wrap{position:relative;overflow:auto;padding:18px}.descbar{margin-bottom:12px;color:var(--muted);font-size:13px;white-space:pre-wrap}.board{position:relative;min-width:1100px;min-height:680px;background:linear-gradient(#eef1f6 1px,transparent 1px),linear-gradient(90deg,#eef1f6 1px,transparent 1px);background-size:24px 24px;border:1px solid #e4e8f0;border-radius:14px;overflow:hidden}.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.edges path.edge{stroke:#7b8baa;stroke-width:1.6;fill:none}.edges text{font-size:11px;fill:#56647c;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.card{position:absolute;min-width:180px;max-width:230px;padding:10px 12px;background:#fff;border:1px solid #cfd6e4;border-radius:10px;box-shadow:0 5px 14px rgba(40,54,94,.07);cursor:grab;user-select:none}.card:hover{box-shadow:0 8px 20px rgba(40,54,94,.12)}.card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.12)}.card.match{outline:3px solid #f3c969;outline-offset:2px}.card .sym{font-weight:720;font-size:14px;line-height:1.25;word-break:break-word}.card .smalltxt{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}.badge{display:inline-block;margin:0 5px 5px 0;padding:2px 6px;border-radius:999px;background:#f1f4f8;color:#475467;font-size:10px}.badge.start{background:#eaf1ff;color:#1f5bd8}.badge.end{background:#ecfdf3;color:#027a48}.side{background:#fff;border-left:1px solid #e1e6ee;overflow:auto;padding:18px}.side h2{margin:0;font-size:20px;word-break:break-word}.section{margin-top:18px}.section h3{margin:0 0 8px;font-size:12px;color:#7c879a;letter-spacing:.04em}.value{font-size:14px;line-height:1.65;white-space:pre-wrap}.pill{display:inline-block;margin:3px 4px 3px 0;padding:4px 8px;border-radius:999px;background:#f1f4f8;color:#475467;font-size:12px}.rel{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed #edf0f5;font-size:13px}.empty{margin-top:80px;text-align:center;color:#98a2b3;font-size:14px;line-height:1.8}.welcome{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:30px;background:rgba(246,248,251,.92)}.welcome-card{width:min(520px,90%);padding:28px;background:#fff;border:1px solid #e1e6ee;border-radius:14px;box-shadow:0 18px 50px rgba(30,45,90,.12);text-align:center}.welcome-card p{color:#667085;line-height:1.7;font-size:14px}.error{color:var(--danger);white-space:pre-wrap;text-align:left;background:#fff1f0;padding:10px;border-radius:8px;margin-top:12px;font-size:12px}.drop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(20,28,45,.72);color:#fff;font-size:24px;font-weight:700}.drop.show{display:flex}input[type=file]{display:none}

.card .resp{margin-top:7px;font-size:12px;line-height:1.5;color:#344054}.card[data-category]::before{content:attr(data-category);display:inline-block;margin-bottom:6px;padding:2px 6px;border-radius:999px;background:#eef2f7;color:#59667c;font-size:10px}.legend{position:absolute;left:14px;bottom:14px;padding:7px 9px;background:rgba(255,255,255,.94);border:1px solid #e2e7ef;border-radius:8px;color:#687386;font-size:11px}

.badge.inferred{background:#fffaeb;color:#9a6700}.badge.unresolved{background:#fff1f0;color:#b42318}
.drop{pointer-events:none}
.rel-kind{color:#344054;font-weight:600}.hint,.meta{color:#667085;font-size:12px;line-height:1.5}.source-list{margin:5px 0 0;padding-left:18px;color:#475467;font-size:12px;line-height:1.6;overflow-wrap:anywhere}.source-list li{margin:2px 0}
</style></head><body><div class="app"><header class="topbar"><div class="brand">Responsibility Map</div><div id="mapTitle" class="title">未加载数据</div><div class="search"><input id="searchInput" placeholder="搜索符号、别名、职责、说明…" disabled></div><div class="toolbar"><button id="loadBtn" class="btn">加载 JSON</button><button id="resetBtn" class="btn" disabled>恢复布局</button></div><input id="fileInput" type="file" accept=".json,application/json"></header><main class="main"><section id="canvasWrap" class="canvas-wrap"><div id="description" class="descbar"></div><div id="board" class="board"><svg id="edges" class="edges"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7b8baa"/></marker></defs></svg><div class="legend">箭头方向：from → relationKind → to</div><div id="welcome" class="welcome"><div class="welcome-card"><h2>加载 Responsibility Map JSON</h2><p>点击“加载 JSON”，或把 JSON 文件拖到页面中。</p><button class="btn" id="welcomeLoadBtn">选择 JSON 文件</button><div id="welcomeError" class="error" style="display:none"></div></div></div></div></section><aside id="side" class="side"><div class="empty">加载 JSON 后，点击节点查看职责边界。</div></aside></main></div><div id="dropOverlay" class="drop">松开以加载 JSON</div><script>
(() => {
  'use strict';

  const labels = {
    orchestration:'编排', coordination:'协调', scheduling:'调度', ownership:'拥有',
    call:'调用', dependency:'依赖', reference:'引用', validation:'校验',
    publication:'发布', production:'产生', consumption:'消费'
  };
  const confidenceLabels = {confirmed:'已核实', inferred:'推断', unresolved:'待核实'};
  const board = document.getElementById('board');
  const canvasWrap = document.getElementById('canvasWrap');
  const edges = document.getElementById('edges');
  const side = document.getElementById('side');
  const search = document.getElementById('searchInput');
  let data = null;
  let pos = {};
  let selected = null;
  let columns = [];
  let savedPositions = {};

  function neighborsFor(d) {
    const neighbors = new Map(d.nodes.map(n => [n.id, new Set()]));
    d.relations.forEach(r => {
      neighbors.get(r.from).add(r.to);
      neighbors.get(r.to).add(r.from);
    });
    return neighbors;
  }

  function visit(neighbors, rank, seed, base) {
    const queue = [seed];
    rank.set(seed, base);
    for (let i = 0; i < queue.length; i++) {
      const current = queue[i];
      for (const next of neighbors.get(current)) {
        if (rank.has(next)) continue;
        rank.set(next, rank.get(current) + 1);
        queue.push(next);
      }
    }
  }

  function validate(d) {
    if (!d || d.schemaVersion !== '1.0') throw Error('不支持的 schemaVersion');
    if (!d.map || !Array.isArray(d.nodes) || !Array.isArray(d.relations)) throw Error('缺少 map、nodes 或 relations');
    const ids = new Set();
    for (const n of d.nodes) {
      if (!n || typeof n.id !== 'string' || !n.id) throw Error('节点 ID 无效');
      if (ids.has(n.id)) throw Error('重复节点 ID: ' + n.id);
      ids.add(n.id);
    }
    for (const r of d.relations) {
      if (!r || !ids.has(r.from) || !ids.has(r.to)) throw Error('关系端点不存在');
    }
    if (d.map.startId && !ids.has(d.map.startId)) throw Error('startId 不存在');
    if (d.map.endId && !ids.has(d.map.endId)) throw Error('endId 不存在');
    if (d.map.startId && d.map.endId) {
      const reachable = new Map();
      visit(neighborsFor(d), reachable, d.map.startId, 0);
      if (!reachable.has(d.map.endId)) throw Error('起点和终点之间没有职责关系路径');
    }
  }

  // Corridor selection uses undirected adjacency; arrows retain responsibility direction.
  function ranks() {
    const ids = data.nodes.map(n => n.id);
    const neighbors = neighborsFor(data);
    const rank = new Map();
    if (ids.length) visit(neighbors, rank, data.map.startId || data.map.endId || ids[0], 0);
    const disconnectedBase = Math.max(0, ...rank.values()) + 1;
    for (const id of ids) if (!rank.has(id)) visit(neighbors, rank, id, disconnectedBase);
    return rank;
  }

  function loadSaved() {
    try {
      const saved = JSON.parse(localStorage.getItem('responsibility:' + data.map.id) || '{}');
      const valid = {};
      for (const n of data.nodes) {
        const p = saved && saved[n.id];
        if (p && Number.isFinite(p.x) && Number.isFinite(p.y) && p.x >= 8 && p.y >= 8) {
          valid[n.id] = {x:p.x, y:p.y};
        }
      }
      return valid;
    } catch { return {}; }
  }

  function save() {
    try { localStorage.setItem('responsibility:' + data.map.id, JSON.stringify(pos)); } catch {}
  }

  function layout() {
    const rank = ranks();
    const groups = new Map();
    pos = {};
    for (const n of data.nodes) {
      const r = rank.get(n.id);
      if (!groups.has(r)) groups.set(r, []);
      groups.get(r).push(n);
      pos[n.id] = {x:60 + r * 280, y:60};
    }
    columns = [...groups.entries()].sort((a, b) => a[0] - b[0]).map(entry => entry[1]);
    savedPositions = loadSaved();
  }

  function fitBoard() {
    let right = 0;
    let bottom = 0;
    board.querySelectorAll('.card').forEach(el => {
      right = Math.max(right, el.offsetLeft + el.offsetWidth);
      bottom = Math.max(bottom, el.offsetTop + el.offsetHeight);
    });
    board.style.width = Math.max(1100, canvasWrap.clientWidth - 36, right + 60) + 'px';
    board.style.height = Math.max(680, bottom + 60) + 'px';
  }

  function render() {
    board.querySelectorAll('.card').forEach(el => el.remove());
    const cards = new Map();
    for (const n of data.nodes) {
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.id = n.id;
      if (n.category) el.dataset.category = n.category;
      el.style.left = pos[n.id].x + 'px';
      el.style.top = pos[n.id].y + 'px';
      const confidence = confidenceLabels[n.confidence] || n.confidence || '未知';
      const confidenceClass = confidenceLabels[n.confidence] ? n.confidence : '';
      const badges =
        (n.id === data.map.startId ? '<span class="badge start">开始</span>' : '') +
        (n.id === data.map.endId ? '<span class="badge end">结束</span>' : '') +
        '<span class="badge ' + confidenceClass + '">' + esc(confidence) + '</span>';
      el.innerHTML = badges + '<div class="sym">' + esc(n.symbol) + '</div>' +
        '<div class="smalltxt">' + esc(n.summary) + '</div>' +
        '<div class="resp">' + esc(n.responsibility) + '</div>';
      el.onclick = () => select(n.id);
      drag(el, n.id);
      board.appendChild(el);
      cards.set(n.id, el);
    }
    for (const group of columns) {
      let y = 60;
      for (const n of group) {
        const el = cards.get(n.id);
        pos[n.id].y = y;
        el.style.top = y + 'px';
        y += el.offsetHeight + 24;
      }
    }
    for (const [id, p] of Object.entries(savedPositions)) {
      if (!cards.has(id)) continue;
      pos[id] = p;
      cards.get(id).style.left = p.x + 'px';
      cards.get(id).style.top = p.y + 'px';
    }
    fitBoard();
    draw();
    document.getElementById('welcome').style.display = 'none';
    search.disabled = false;
    document.getElementById('resetBtn').disabled = false;
    applySearch();
    if (selected && cards.has(selected)) select(selected);
  }

  function center(el) {
    return {x:el.offsetLeft + el.offsetWidth / 2, y:el.offsetTop + el.offsetHeight / 2};
  }

  function boundaryPoint(el, toward, gap) {
    const a = center(el);
    const b = center(toward);
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const length = Math.hypot(dx, dy);
    if (!length) return a;
    const xScale = dx ? el.offsetWidth / 2 / Math.abs(dx) : Infinity;
    const yScale = dy ? el.offsetHeight / 2 / Math.abs(dy) : Infinity;
    const scale = Math.min(xScale, yScale);
    return {x:a.x + dx * scale + dx / length * gap, y:a.y + dy * scale + dy / length * gap};
  }

  function draw() {
    edges.querySelectorAll('path.edge,text.edge').forEach(el => el.remove());
    for (const r of data.relations) {
      const a = board.querySelector('[data-id="' + CSS.escape(r.from) + '"]');
      const b = board.querySelector('[data-id="' + CSS.escape(r.to) + '"]');
      if (!a || !b) continue;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'edge');
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('class', 'edge');
      if (a === b) {
        const right = a.offsetLeft + a.offsetWidth;
        const top = a.offsetTop;
        const mid = a.offsetLeft + a.offsetWidth / 2;
        path.setAttribute('d', 'M ' + (right + 4) + ' ' + (top + a.offsetHeight / 2) +
          ' C ' + (right + 30) + ' ' + (top - 35) + ', ' + (mid + 40) + ' ' + (top - 35) +
          ', ' + mid + ' ' + (top - 8));
        label.setAttribute('x', right + 12);
        label.setAttribute('y', top - 15);
      } else {
        const start = boundaryPoint(a, b, 4);
        const end = boundaryPoint(b, a, 8);
        const midX = (start.x + end.x) / 2;
        path.setAttribute('d', 'M ' + start.x + ' ' + start.y + ' C ' + midX + ' ' + start.y +
          ', ' + midX + ' ' + end.y + ', ' + end.x + ' ' + end.y);
        label.setAttribute('x', midX);
        label.setAttribute('y', (start.y + end.y) / 2 - 6);
      }
      path.setAttribute('marker-end', 'url(#arrow)');
      edges.appendChild(path);
      label.textContent = labels[r.relationKind] || r.relationKind;
      edges.appendChild(label);
    }
  }

  function drag(el, id) {
    let startX, startY, oldX, oldY, down = false;
    el.onpointerdown = e => {
      if (e.button !== 0) return;
      down = true;
      startX = e.clientX;
      startY = e.clientY;
      oldX = pos[id].x;
      oldY = pos[id].y;
      el.setPointerCapture(e.pointerId);
    };
    el.onpointermove = e => {
      if (!down) return;
      pos[id] = {x:Math.max(8, oldX + e.clientX - startX), y:Math.max(8, oldY + e.clientY - startY)};
      el.style.left = pos[id].x + 'px';
      el.style.top = pos[id].y + 'px';
      fitBoard();
      draw();
    };
    el.onpointerup = () => { if (down) save(); down = false; };
    el.onpointercancel = () => { down = false; };
  }

  function sourceList(items) {
    return '<ul class="source-list">' + items.map(item => '<li>' + esc(item) + '</li>').join('') + '</ul>';
  }

  function select(id) {
    selected = id;
    board.querySelectorAll('.card').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
    const n = data.nodes.find(item => item.id === id);
    const rels = data.relations.filter(r => r.from === id || r.to === id);
    let html = '<h2>' + esc(n.symbol) + '</h2>' +
      '<div class="section"><h3>置信度</h3><div class="value">' + esc(confidenceLabels[n.confidence] || n.confidence) + '</div></div>' +
      '<div class="section"><h3>一句话</h3><div class="value">' + esc(n.summary) + '</div></div>' +
      '<div class="section"><h3>主要职责</h3><div class="value">' + esc(n.responsibility) + '</div></div>';
    if (Array.isArray(n.aliases) && n.aliases.length) {
      html += '<div class="section"><h3>别名</h3>' +
        n.aliases.map(item => '<div class="pill">' + esc(item) + '</div>').join('') + '</div>';
    }
    if (n.notResponsibleFor?.length) {
      html += '<div class="section"><h3>明确不负责</h3>' +
        n.notResponsibleFor.map(item => '<div class="pill">' + esc(item) + '</div>').join('') + '</div>';
    }
    if (n.definition) {
      html += '<div class="section"><h3>定义位置</h3><div class="value">' + esc(n.definition) + '</div></div>';
    }
    if (n.evidence?.length) {
      html += '<div class="section"><h3>节点证据</h3>' + sourceList(n.evidence) + '</div>';
    }
    if (rels.length) {
      html += '<div class="section"><h3>关系</h3><div class="hint">→ 本节点指向对方；← 对方指向本节点</div>';
      for (const r of rels) {
        const outgoing = r.from === id;
        const otherId = outgoing ? r.to : r.from;
        const other = data.nodes.find(item => item.id === otherId);
        html += '<div class="rel"><div class="rel-kind">' + (outgoing ? '→ ' : '← ') +
          esc(labels[r.relationKind] || r.relationKind) + '</div><div>' +
          esc(other?.symbol || otherId) +
          (r.description ? '<div class="meta">' + esc(r.description) + '</div>' : '') +
          '<div class="meta">置信度：' + esc(confidenceLabels[r.confidence] || r.confidence) + '</div>' +
          (r.evidence?.length ? sourceList(r.evidence) : '') + '</div></div>';
      }
      html += '</div>';
    }
    side.innerHTML = html;
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[c]);
  }

  function applySearch() {
    if (!data) return;
    const q = search.value.trim().toLowerCase();
    data.nodes.forEach(n => {
      const el = board.querySelector('[data-id="' + CSS.escape(n.id) + '"]');
      const content = n.symbol + ' ' + n.summary + ' ' + n.responsibility + ' ' +
        (n.category || '') + ' ' + (Array.isArray(n.aliases) ? n.aliases.join(' ') : '') +
        ' ' + (n.notResponsibleFor || []).join(' ');
      el.classList.toggle('match', !!q && content.toLowerCase().includes(q));
    });
  }

  search.oninput = applySearch;
  document.getElementById('resetBtn').onclick = () => {
    try { localStorage.removeItem('responsibility:' + data.map.id); } catch {}
    layout();
    render();
  };

  function load(d) {
    validate(d);
    data = d;
    selected = null;
    document.getElementById('mapTitle').textContent = d.map.title;
    document.getElementById('description').textContent = d.map.description || '';
    layout();
    render();
  }

  function setupLoader(defaultName, onData) {
    const fileInput = document.getElementById('fileInput');
    const loadBtn = document.getElementById('loadBtn');
    const drop = document.getElementById('dropOverlay');
    let hideDropTimer = null;
    const cancelHideDrop = () => {
      if (hideDropTimer !== null) clearTimeout(hideDropTimer);
      hideDropTimer = null;
    };
    const hideDrop = () => { cancelHideDrop(); drop.classList.remove('show'); };
    const showDrop = e => {
      if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
      e.preventDefault();
      cancelHideDrop();
      drop.classList.add('show');
    };
    const err = document.getElementById('welcomeError');
    const fail = e => {
      err.style.display = 'block';
      err.textContent = String(e && e.message || e);
      document.getElementById('welcome').style.display = 'flex';
    };
    const parse = txt => {
      try { onData(JSON.parse(txt)); err.style.display = 'none'; }
      catch (e) { fail(e); }
    };
    loadBtn.onclick = () => fileInput.click();
    document.getElementById('welcomeLoadBtn').onclick = () => fileInput.click();
    fileInput.onchange = () => {
      const f = fileInput.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => parse(reader.result);
      reader.onerror = () => fail('读取文件失败');
      reader.readAsText(f, 'utf-8');
      fileInput.value = '';
    };
    window.addEventListener('dragenter', showDrop);
    window.addEventListener('dragover', showDrop);
    window.addEventListener('dragleave', e => {
      if (!drop.classList.contains('show')) return;
      e.preventDefault();
      cancelHideDrop();
      hideDropTimer = setTimeout(hideDrop, 180);
    });
    window.addEventListener('drop', e => {
      e.preventDefault();
      hideDrop();
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => parse(reader.result);
      reader.onerror = () => fail('读取文件失败');
      reader.readAsText(f, 'utf-8');
    });
    if (location.protocol !== 'file:') {
      const path = new URLSearchParams(location.search).get('data') || defaultName;
      fetch(path).then(response => {
        if (!response.ok) throw new Error('未自动加载 ' + path);
        return response.text();
      }).then(parse).catch(() => {});
    }
  }

  setupLoader('responsibility-map.json', load);
})();
</script></body></html>
